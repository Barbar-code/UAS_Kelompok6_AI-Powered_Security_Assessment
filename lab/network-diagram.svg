<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Topologi lab DVWA lokal</title>
  <desc id="description">Browser host terhubung ke DVWA melalui localhost port 8080. DVWA dan MySQL berada pada jaringan Docker internal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 24px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .detail { font: 15px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; }
      .container { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; rx: 10; }
      .network { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; rx: 16; }
      .edge { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="28" y="24" width="944" height="472" class="box"/>
  <text x="500" y="62" text-anchor="middle" class="title">AI-Powered Security Assessment — Lab DVWA</text>

  <rect x="82" y="130" width="278" height="150" class="container"/>
  <text x="221" y="170" text-anchor="middle" class="label">Mesin host</text>
  <text x="221" y="204" text-anchor="middle" class="detail">Peramban / alat pengujian</text>
  <text x="221" y="237" text-anchor="middle" class="detail">http://localhost:8080</text>
  <text x="221" y="260" text-anchor="middle" class="detail">Terikat ke 127.0.0.1</text>

  <rect x="425" y="108" width="496" height="340" class="network"/>
  <text x="673" y="145" text-anchor="middle" class="label">Docker network: uas-lab-net</text>
  <text x="673" y="171" text-anchor="middle" class="detail">internal: true • alamat container dinamis</text>

  <rect x="477" y="205" width="190" height="156" class="container"/>
  <text x="572" y="246" text-anchor="middle" class="label">dvwa-web</text>
  <text x="572" y="281" text-anchor="middle" class="detail">DVWA</text>
  <text x="572" y="310" text-anchor="middle" class="detail">port 80</text>
  <text x="572" y="337" text-anchor="middle" class="detail">tidak ada IP tetap</text>

  <rect x="730" y="205" width="160" height="156" class="container"/>
  <text x="810" y="246" text-anchor="middle" class="label">dvwa-db</text>
  <text x="810" y="281" text-anchor="middle" class="detail">MySQL</text>
  <text x="810" y="310" text-anchor="middle" class="detail">port 3306</text>
  <text x="810" y="337" text-anchor="middle" class="detail">tidak dipublikasikan</text>

  <path d="M360 205 C390 205, 405 260, 468 260" class="edge"/>
  <text x="408" y="220" text-anchor="middle" class="detail">127.0.0.1:8080 → 80</text>
  <path d="M667 283 L720 283" class="edge"/>
  <text x="694" y="270" text-anchor="middle" class="detail">internal</text>

  <text x="500" y="475" text-anchor="middle" class="detail">Tidak ada port database yang dipublikasikan; jangan membuka target ke jaringan lain.</text>
</svg>
